<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3eb">
  <title>リアル人生ゲーム</title>
  <link rel="stylesheet" href="./style.css">
  <script defer src="./cards.js"></script>
  <script defer src="./script.js"></script>
</head>
<body>
  <main class="app">
    <header class="header"><span class="brand-mark" aria-hidden="true">↗</span><span>リアル人生ゲーム</span><span class="badge">○○学祭</span></header>
    <p id="notice" class="notice" role="status" hidden></p>
    <section id="welcome" class="screen">
      <p class="eyebrow">YOUR NEXT CHAPTER</p>
      <h1>次の一枚で、<br>人生が動きます。</h1>
      <p class="intro">カードを引いて、お金を増やして。<br>次はどんな出来事が待っているでしょう。</p>
      <div class="preview-card" aria-hidden="true"><span>✈</span><strong>旅行に行った</strong><p>−20,000円 · 3マス進む</p></div>
      <div class="start-money"><span id="welcome-label">はじめの所持金</span><strong id="welcome-money"></strong></div>
      <button id="start" class="primary" type="button">ゲーム開始 <span aria-hidden="true">→</span></button>
      <button id="resume" class="primary" type="button" hidden>続きから再開 <span aria-hidden="true">→</span></button>
      <button id="new-game" class="text-button" type="button" hidden>新しく始める</button>
    </section>
    <section id="play" class="screen" hidden>
      <div class="wallet"><span>現在の所持金</span><strong id="money"></strong></div>
      <div class="progress-info"><span id="current-era"></span><span id="position"></span></div>
      <progress id="board-progress" max="50" value="0" aria-label="ゴールまでの進み具合"></progress>
      <article id="card" class="event-card"><span id="card-icon" class="card-icon" aria-hidden="true">✦</span><h2 id="card-title">どんな人生が待っていますか？</h2><p id="card-money" class="card-money">カードを引いて始めましょう</p><div id="card-move" class="move">表示された数だけ移動します</div></article>
      <button id="draw" class="primary" type="button">カードを引く <span aria-hidden="true">＋</span></button>
      <div class="secondary-actions"><button id="restart" class="text-button" type="button">やり直す</button><button id="finish" class="text-button" type="button">ゲーム終了 →</button></div>
    </section>
    <section id="result" class="screen result" hidden>
      <p class="eyebrow">GOAL / お疲れさまでした</p><span class="result-icon" aria-hidden="true">⚑</span><h1>あなたの人生、<br>ここでひと区切り。</h1><p id="result-message" class="intro">ゴールです。結果をスタッフに見せてください。</p>
      <div class="wallet"><span>最終所持金</span><strong id="result-money"></strong><span id="result-count" class="wallet-note"></span></div>
      <button id="again" class="primary" type="button">最初から遊ぶ <span aria-hidden="true">→</span></button>
    </section>
    <p id="announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
    <noscript><p class="notice">遊ぶにはブラウザのJavaScriptを有効にしてください。</p></noscript>
  </main>
  <dialog id="confirm-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-description"><form method="dialog"><h2 id="dialog-title"></h2><p id="dialog-description"></p><div class="dialog-actions"><button class="cancel" value="cancel" autofocus>キャンセル</button><button id="confirm-ok" class="primary" value="ok">確定する</button></div></form></dialog>
</body>
</html>
